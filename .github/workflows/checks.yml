name: Tests and plugin package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Use the standard Intel Mac pool when hosted ARM capacity is constrained.
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Tests import the exact portable dependencies that ship in the plugin.
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_bundle.py --source
      - run: python tools/build.py
      - run: python tools/check_bundle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shelly-plugin-${{ matrix.os }}
          path: dist/*.zip
